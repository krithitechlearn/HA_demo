spring:
  application:
    name: shore-excursions-app
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shoreexcursions}
    username: ${DATABASE_USERNAME:shoreexcursions}
    password: ${DATABASE_PASSWORD:shoreexcursions}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:changeme-this-is-a-very-long-secret-key-for-development-only-256bits}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  image:
    storage:
      base-url: ${IMAGE_STORAGE_BASE_URL:http://localhost:9000}
      bucket: ${IMAGE_STORAGE_BUCKET:shore-excursions}
      access-key: ${IMAGE_STORAGE_ACCESS_KEY:minioadmin}
      secret-key: ${IMAGE_STORAGE_SECRET_KEY:minioadmin}
    max-per-entity: 10

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

logging:
  level:
    root: INFO
    com.shoreexcursions: DEBUG
    org.hibernate.SQL: WARN
